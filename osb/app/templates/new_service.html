{% extends "base.html" %}
{% block title %}Nuevo servicio{% endblock %}
{% block content %}
<section class="hero">
  <h1>Aprovisionar un nuevo servicio</h1>
  <p class="muted">Llena los campos y Cumbre se encarga de configurar Envoy, rutas, auth y rate limiting.</p>
</section>

<form method="post" action="/ui/new" class="form">
  <div class="row">
    <label>Nombre (kebab-case)
      <input name="name" pattern="^[a-z][a-z0-9-]{2,63}$" required placeholder="orders-api">
    </label>
    <label>Equipo
      <input name="team" required placeholder="payments">
    </label>
  </div>
  <label>Descripción
    <input name="description" placeholder="API de órdenes — usado por el frontend de checkout">
  </label>
  <div class="row">
    <label>Upstream host
      <input name="upstream_host" required placeholder="orders-service">
    </label>
    <label>Upstream port
      <input name="upstream_port" type="number" value="8080" min="1" max="65535" required>
    </label>
  </div>
  <div class="row">
    <label>Ruta pública
      <input name="public_path" required value="/" placeholder="/api/v1/orders">
    </label>
    <label>Rate limit (req/min)
      <input name="rate_limit_rpm" type="number" value="600" min="1" required>
    </label>
  </div>
  <label class="check">
    <input name="requires_auth" type="checkbox" checked value="true"> Requiere autenticación
  </label>
  <div class="actions">
    <a class="btn" href="/">Cancelar</a>
    <button type="submit" class="btn-primary">Aprovisionar</button>
  </div>
</form>
{% endblock %}

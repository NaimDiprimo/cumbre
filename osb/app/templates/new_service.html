{% extends "base.html" %}
{% block title %}Nuevo servicio{% endblock %}
{% block content %}

<div class="form-page reveal" data-delay="0">

  <!-- Hero -->
  <div class="form-hero">
    <h1>Aprovisionar <span class="gradient-text">un servicio</span></h1>
    <p>Cumbre configura Envoy, rutas, autenticación y rate limiting automáticamente. Sin tickets.</p>
  </div>

  <!-- Form card -->
  <form method="post" action="/ui/new" class="form" id="provision-form">

    <!-- Row: nombre + equipo -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="name">Nombre del servicio</label>
        <input class="form-input" id="name" name="name"
          pattern="^[a-z][a-z0-9-]{2,63}$" required
          placeholder="orders-api"
          autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label" for="team">Equipo</label>
        <input class="form-input" id="team" name="team"
          required placeholder="payments" autocomplete="off">
      </div>
    </div>

    <!-- Descripción -->
    <div class="form-group">
      <label class="form-label" for="description">Descripción <span style="opacity:.5">(opcional)</span></label>
      <input class="form-input" id="description" name="description"
        placeholder="API de órdenes — usado por el frontend de checkout">
    </div>

    <div class="form-divider"></div>

    <!-- Row: upstream host + puerto -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="upstream_host">Upstream host</label>
        <input class="form-input" id="upstream_host" name="upstream_host"
          required placeholder="orders-service" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label" for="upstream_port">Puerto</label>
        <input class="form-input" id="upstream_port" name="upstream_port"
          type="number" value="8080" min="1" max="65535" required>
      </div>
    </div>

    <!-- Row: ruta pública + rate limit -->
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="public_path">Ruta pública</label>
        <input class="form-input" id="public_path" name="public_path"
          required value="/" placeholder="/api/v1/orders">
      </div>
      <div class="form-group">
        <label class="form-label" for="rate_limit_rpm">Rate limit <span style="opacity:.5">(req/min)</span></label>
        <input class="form-input" id="rate_limit_rpm" name="rate_limit_rpm"
          type="number" value="600" min="1" max="1000000" required>
      </div>
    </div>

    <div class="form-divider"></div>

    <!-- Checkbox auth -->
    <div class="form-group">
      <label class="checkbox-wrap">
        <input class="form-checkbox" id="requires_auth" name="requires_auth"
          type="checkbox" checked value="true">
        <span class="checkbox-label">Requiere autenticación JWT</span>
      </label>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <a href="/" class="btn-ghost">Cancelar</a>
      <button type="submit" class="btn-primary" id="submit-btn">
        Aprovisionar
      </button>
    </div>
  </form>
</div>

<script>
document.getElementById('provision-form').addEventListener('submit', function() {
  var btn = document.getElementById('submit-btn');
  btn.classList.add('loading');
  btn.innerHTML = 'Aprovisionando';
});
</script>

{% endblock %}

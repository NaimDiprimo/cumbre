# Cumbre — Internal Developer Platform
# Levanta TODO el sistema con: docker-compose up
#
# Servicios:
#   postgres        - Estado del OSB
#   redis           - Cola de tareas
#   osb             - Open Service Broker (API + Web UI)
#   osb-worker      - Worker async que consume la cola
#   sovereign       - Control plane XDS
#   envoy           - Data plane (proxy)
#   auth-sidecar    - Validación JWT vía ext_authz
#   echo-service    - Backend de demo
#   orders-service  - Backend de demo (estilo FinTech)
#   prometheus      - Métricas
#   grafana         - Dashboards

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cumbre}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD:-cumbre-dev-change-in-prod}
      POSTGRES_DB: ${POSTGRES_DB:-cumbre}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cumbre"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [cumbre_net]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [cumbre_net]
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  osb:
    build: ./osb
    restart: unless-stopped
    environment:
      OSB_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cumbre}:${POSTGRES_DB_PASSWORD:-cumbre-dev-change-in-prod}@postgres:5432/${POSTGRES_DB:-cumbre}
      OSB_REDIS_URL: redis://redis:6379/0
      OSB_ENVIRONMENT: ${ENVIRONMENT:-dev}
      OSB_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [cumbre_net]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.75'

  osb-worker:
    build: ./osb
    restart: unless-stopped
    command: ["python", "-m", "app.workers.provisioner"]
    environment:
      OSB_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cumbre}:${POSTGRES_DB_PASSWORD:-cumbre-dev-change-in-prod}@postgres:5432/${POSTGRES_DB:-cumbre}
      OSB_REDIS_URL: redis://redis:6379/0
      OSB_LOG_LEVEL: INFO
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      osb:      { condition: service_started }
    networks: [cumbre_net]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.50'

  sovereign:
    build: ./sovereign
    restart: unless-stopped
    environment:
      SOVEREIGN_DB_URL: postgresql+psycopg2://${POSTGRES_USER:-cumbre}:${POSTGRES_DB_PASSWORD:-cumbre-dev-change-in-prod}@postgres:5432/${POSTGRES_DB:-cumbre}
    ports:
      - "8081:8080"
    depends_on:
      postgres: { condition: service_healthy }
      osb:      { condition: service_started }
    networks: [cumbre_net]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.50'

  envoy:
    build: ./envoy
    restart: unless-stopped
    ports:
      - "10000:10000"   # tráfico HTTP entrante
      - "9901:9901"     # admin/stats
    depends_on:
      sovereign: { condition: service_started }
    networks: [cumbre_net]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  auth-sidecar:
    build: ./auth-sidecar
    restart: unless-stopped
    environment:
      CUMBRE_JWT_SECRET: ${CUMBRE_JWT_SECRET:-dev-only-secret-change-me-min-32-chars!!}
      CUMBRE_REDIS_URL: redis://redis:6379/1
    networks: [cumbre_net]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.50'

  echo-service:
    build: ./backends/echo-service
    environment:
      SERVICE_NAME: echo-service
    networks: [cumbre_net]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

  orders-service:
    build: ./backends/orders-service
    networks: [cumbre_net]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [cumbre_net]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.50'

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-cumbre-grafana-dev}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      prometheus: { condition: service_started }
    networks: [cumbre_net]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.50'

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  cumbre_net:
    driver: bridge

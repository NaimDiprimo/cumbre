# Sovereign 0.23.0 — SovereignConfigv2 schema
# Control plane XDS: expone endpoints LDS/CDS/RDS a Envoy.
# Al recibir una petición XDS, Sovereign renderiza los templates Jinja2
# con los datos frescos del context (servicios desde Postgres).

# Al menos una fuente es obligatoria. Usamos inline con un placeholder
# porque nuestros datos vienen del template_context (plugin de Postgres).
sources:
  - type: inline
    config:
      instances:
        - _placeholder: true

# Tres templates: uno por tipo XDS que Envoy pide.
templates:
  default:
    - type: listeners
      spec:
        protocol: file
        serialization: jinja2
        path: /app/templates/listeners.yaml.j2
    - type: clusters
      spec:
        protocol: file
        serialization: jinja2
        path: /app/templates/clusters.yaml.j2
    - type: routes
      spec:
        protocol: file
        serialization: jinja2
        path: /app/templates/routes.yaml.j2

# Plugin propio: lee servicios en estado 'ready' desde Postgres.
# El atributo `services` es un ServicesList que Jinja2 puede iterar.
template_context:
  context:
    services:
      protocol: module
      serialization: raw
      path: "plugins.osb_context:services"
  refresh_rate: 10

# Sin node matching: todos los Envoys reciben la misma config.
matching:
  enabled: false
